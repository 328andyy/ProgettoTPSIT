<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Registrati</title>
</head>
<body>
    <h2>Registrati</h2>
    <form id="formRegistrazione">
        Scegli Username: <input type="text" id="new_user" required><br><br>
        Scegli Password: <input type="password" id="new_pass" required><br><br>
        <input type="submit" value="Registrati">
    </form>
    <br>
    <a href="accedi.html">Vai al Login</a>

    <script>
        document.getElementById('formRegistrazione').addEventListener('submit', function(e) {
            e.preventDefault(); // Impedisce il ricaricamento della pagina
            
            const utente = document.getElementById('new_user').value;
            const password = document.getElementById('new_pass').value;

            // Salva i dati nel database locale del browser
            localStorage.setItem(utente, password);

            alert('Registrazione completata con successo!');
            this.reset(); // Svuota i campi del form
        });
    </script>
</body>
</html>
