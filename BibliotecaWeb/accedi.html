<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Accedi</title>
</head>
<body>
    <h2>Accedi</h2>
    <form id="formLogin">
        Username: <input type="text" id="user" required><br><br>
        Password: <input type="password" id="pass" required><br><br>
        <input type="submit" value="Accedi">
    </form>
    <br>
    <a href="registrati.html">Non sei registrato? Clicca qui</a>

    <script>
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault(); //impedisce il ricaricamento della pagina
            
            //prende i dati inseriti nel form
            const utente = document.getElementById('user').value;
            const password = document.getElementById('pass').value;

            //prende i dati del local storage
            const passwordSalvata = localStorage.getItem(utente);

            //confronta i dati inseriti con quelli del local storage
            if (passwordSalvata && passwordSalvata === password) {
                alert('Accesso eseguito! Benvenuto ' + utente);
            } else {
                alert('Username o Password errati.');
            }
        });
    </script>
</body>
</html>
